        <div class="rating" id="rating">
            <span data-star="1">★</span>
            <span data-star="2">★</span>
            <span data-star="3">★</span>
            <span data-star="4">★</span>
            <span data-star="5">★</span>
        </div>

        <textarea id="commentInput" rows="3" placeholder="Viết bình luận của bạn..."></textarea>
        <button onclick="addComment()">Gửi Đánh Giá</button>

        <div id="commentList"></div>
    </div>

<footer>
    © 2026 Nhóm 11 lớp 12D1

<script>
let selectedRating = 0;

// Xử lý chọn sao
document.querySelectorAll("#rating span").forEach(star => {
    star.addEventListener("click", function() {
        selectedRating = this.getAttribute("data-star");
        updateStars();
    });
});

function updateStars() {
    document.querySelectorAll("#rating span").forEach(star => {
        if (star.getAttribute("data-star") <= selectedRating) {
            star.style.color = "#ffc107";
        } else {
            star.style.color = "#ccc";
        }
    });
}

// Thêm bình luận
function addComment() {
    const commentText = document.getElementById("commentInput").value;

    if(commentText === "" || selectedRating === 0){
        alert("Vui lòng chọn số sao và nhập bình luận!");
        return;
    }

    const commentBox = document.createElement("div");
    commentBox.classList.add("comment-item");
    commentBox.innerHTML = `
        <p><strong>Đánh giá:</strong> ${"★".repeat(selectedRating)}</p>
        <p>${commentText}</p>
        <hr>
    `;

    document.getElementById("commentList").prepend(commentBox);

    document.getElementById("commentInput").value = "";
    selectedRating = 0;
    updateStars();
}
</script>
   <script>
function toggleTheme() {
  document.body.classList.toggle("dark");

  const btn = document.querySelector(".toggle-theme");

  if (document.body.classList.contains("dark")) {
    btn.textContent = "☀️";
    localStorage.setItem("theme", "dark");
  } else {
    btn.textContent = "🌙";
    localStorage.setItem("theme", "light");
  }
}

window.onload = function () {
  const btn = document.querySelector(".toggle-theme");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    btn.textContent = "☀️";
  } else {
    btn.textContent = "🌙";
  }
};
</script>

<script>
const bgMusic = document.getElementById("bgMusic");
const musicBtn = document.querySelector(".music-toggle");

let musicOn = localStorage.getItem("music") !== "off";

window.addEventListener("load", () => {
  if (musicOn) {
    bgMusic.volume = 0.4;
    bgMusic.play().catch(()=>{});
  } else {
    musicBtn.classList.add("off");
    musicBtn.textContent = "🔇";
  }
});

function toggleMusic() {
  musicOn = !musicOn;
  if (musicOn) {
    bgMusic.play();
    musicBtn.textContent = "🎵";
    musicBtn.classList.remove("off");
    localStorage.setItem("music", "on");
  } else {
    bgMusic.pause();
    musicBtn.textContent = "🔇";
    musicBtn.classList.add("off");
    localStorage.setItem("music", "off");
  }
}
</script>
