<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery 8 Cây Cầu</title>
<link rel="stylesheet" href="style.css">

<style>
.gallery-container{
    max-width:1200px;
    margin:50px auto;
    padding:20px;
}

.gallery-container h1{
    text-align:center;
    margin-bottom:40px;
    color:#0d47a1;
}

/* GRID ẢNH */
.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery-grid img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

.gallery-grid img:hover{
    transform:scale(1.05);
}

/* FULLSCREEN */
.fullscreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.fullscreen img{
    max-width:90%;
    max-height:90%;
    border-radius:15px;
}

.fullscreen span{
    position:absolute;
    top:30px;
    right:40px;
    font-size:40px;
    color:white;
    cursor:pointer;
}

/* SO SÁNH ẢNH */
.compare-section{
    margin-top:80px;
}

.compare-section h2{
    text-align:center;
    margin-bottom:30px;
    color:#0d47a1;
}

.compare-wrapper{
    position:relative;
    max-width:800px;
    margin:auto;
}

.compare-wrapper img{
    width:100%;
    display:block;
    border-radius:15px;
}

.compare-overlay{
    position:absolute;
    top:0;
    left:0;
    width:50%;
    height:100%;
    overflow:hidden;
}

.compare-overlay img{
    width:100%;
}

.slider{
    position:absolute;
    top:0;
    left:50%;
    width:4px;
    height:100%;
    background:#fff;
    cursor:ew-resize;
}
</style>
</head>
<body>

<header>
<h1>Gallery 8 Cây Cầu Đông Nam Bộ</h1>
</header>
<nav>
    <a href="index.html">Trang chủ</a>
    <a href="about.html">Giới thiệu</a>
    <a href="list.html">Danh sách cầu</a>
    <a href="compare.html">So sánh</a>
    <a href="timeline.html">Lịch sử</a>
    <a href="gallery.html">Gallery</a>
    <a href="map.html">Bản đồ</a>
    <a href="education.html">Giáo dục</a>
    <a href="contact.html">Liên hệ</a>
</nav>
<div class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</div>
<audio id="bgMusic" loop>
  <source src="cau.mp3" type="audio/mpeg">
</audio>

<div class="music-toggle" onclick="toggleMusic()">🎵</div>

<section class="gallery-container">

<!-- TỆP ẢNH CHUNG -->
<div class="gallery-grid">
    <img src="cau-saigon.jpg" onclick="openFull(this.src)">
    <img src="cau-thuthiem.jpg" onclick="openFull(this.src)">
    <img src="cau-binhtrieu.jpg" onclick="openFull(this.src)">
    <img src="cau-phucuong.jpg" onclick="openFull(this.src)">
    <img src="cau-dongnai.jpg" onclick="openFull(this.src)">
    <img src="cau-cualap.jpg" onclick="openFull(this.src)">
    <img src="cau-comay.jpg" onclick="openFull(this.src)">
    <img src="cau-anhao.jpg" onclick="openFull(this.src)">
</div>

<!-- FULLSCREEN -->
<div class="fullscreen" id="fullscreen">
    <span onclick="closeFull()">×</span>
    <img id="fullImg">
</div>

<!-- SO SÁNH 1 CẦU -->
<div class="compare-section">
    <h2>So sánh ảnh Cầu Cỏ May (Cũ và Mới)</h2>

    <div class="compare-box">
  <img src="before1.jpg">
  <div class="after-wrap">
    <img src="after1.jpg">
  </div>
  <input type="range" min="0" max="100" value="50" class="slider">
</div>

</div>

</section>

<footer>
© 2026 Nhóm 11 lớp 12D1
</footer>

<script>
// FULLSCREEN
function openFull(src){
    document.getElementById("fullscreen").style.display="flex";
    document.getElementById("fullImg").src=src;
}
function closeFull(){
    document.getElementById("fullscreen").style.display="none";
}

// SO SÁNH ẢNH
const slider=document.getElementById("slider");
const overlay=document.getElementById("overlay");
const box=document.getElementById("compareBox");

slider.addEventListener("mousedown",startSlide);

function startSlide(e){
    window.addEventListener("mousemove",slideMove);
    window.addEventListener("mouseup",stopSlide);
}

function slideMove(e){
    let rect=box.getBoundingClientRect();
    let x=e.clientX-rect.left;
    if(x<0)x=0;
    if(x>rect.width)x=rect.width;

    overlay.style.width=x+"px";
    slider.style.left=x+"px";
}

function stopSlide(){
    window.removeEventListener("mousemove",slideMove);
}
</script>
    <script>
function toggleTheme() {
  document.body.classList.toggle("dark");

  const btn = document.querySelector(".toggle-theme");

  if (document.body.classList.contains("dark")) {
    btn.textContent = "☀️";
    localStorage.setItem("theme", "dark");
  } else {
    btn.textContent = "🌙";
    localStorage.setItem("theme", "light");
  }
}

window.onload = function () {
  const btn = document.querySelector(".toggle-theme");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    btn.textContent = "☀️";
  } else {
    btn.textContent = "🌙";
  }
};
</script>

<script>
const bgMusic = document.getElementById("bgMusic");
const musicBtn = document.querySelector(".music-toggle");

let musicOn = localStorage.getItem("music") !== "off";

window.addEventListener("load", () => {
  if (musicOn) {
    bgMusic.volume = 0.4;
    bgMusic.play().catch(()=>{});
  } else {
    musicBtn.classList.add("off");
    musicBtn.textContent = "🔇";
  }
});

function toggleMusic() {
  musicOn = !musicOn;
  if (musicOn) {
    bgMusic.play();
    musicBtn.textContent = "🎵";
    musicBtn.classList.remove("off");
    localStorage.setItem("music", "on");
  } else {
    bgMusic.pause();
    musicBtn.textContent = "🔇";
    musicBtn.classList.add("off");
    localStorage.setItem("music", "off");
  }
}
</script>

<button id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  ↑
</button>

</body>
</html>
